<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><style>
body{font:14px system-ui,sans-serif;width:340px;margin:0;color:#14202E}
header{background:#0A3D73;color:#fff;padding:12px 14px;font-weight:700}
main{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
input{width:100%;box-sizing:border-box;height:36px;border:1px solid #C5D0DC;border-radius:8px;padding:0 8px}
button{height:36px;border:0;border-radius:8px;background:#0A3D73;color:#fff;font-weight:600;cursor:pointer;padding:0 12px}
button.alt{background:#fff;color:#0A3D73;border:1px solid #C5D0DC}
.job{border:1px solid #E1E7EE;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.muted{color:#5A6878;font-size:12px}.err{color:#B42318;font-size:12px}
</style></head><body>
<header>MB SGK Robotu</header>
<main>
  <section id="setup" hidden>
    <p class="muted">Yazılımda SGK → Robot sekmesinden aldığınız anahtarı yapıştırın.</p>
    <input id="tok" placeholder="mbsgk_…" autocomplete="off">
    <button id="save">Kaydet</button>
  </section>
  <section id="list" hidden>
    <div class="muted" id="company"></div>
    <div id="jobs"></div>
    <div style="display:flex;gap:6px"><button id="refresh" class="alt">Yenile</button><button id="logout" class="alt">Anahtarı sil</button></div>
  </section>
  <div id="msg" class="err"></div>
  <p class="muted">Robot SGK ekranını açar, bilgileri doldurur. Güvenlik kodunu siz girer, "Gönder / Kaydet" tuşuna siz basarsınız.</p>
</main>
<script src="popup.js"></script>
</body></html>
